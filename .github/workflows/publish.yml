name: Publish next article
on:
  schedule:
    # GitHub's schedule event is best-effort: per GitHub Docs it can be delayed
    # under load (worst at minute 0 / top of the hour) and queued jobs may be
    # dropped entirely. Measured on this repo: +4h27m late (2026-11-16),
    # no run at all (2026-11-17), +5h28m late (2026-11-18) with '0 *' crons.
    # Mitigation: fire twice, off the congested minute 0, both before the
    # 10:00 JST GBP check that self-heals by manual dispatch if still missing.
    # publish_next.py publishes at most one due article per run, so the
    # second run is a no-op when the first one already published.
    - cron: '17 22 * * *'  # 07:17 JST primary
    - cron: '47 23 * * *'  # 08:47 JST backstop
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish one due article
        run: python3 tools/publish_next.py
      - name: Commit changes when present
        id: commit
        run: |
          git add articles sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish next scheduled article'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger the existing deploy workflow.
      - name: FTP Deploy
        if: steps.commit.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /karustep-LP/
