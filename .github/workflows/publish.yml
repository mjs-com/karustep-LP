name: Publish next article
on:
  schedule:
    - cron: '0 22 * * *'  # 07:00 JST (moved from 09:00 JST on 2026-11-17 to absorb GitHub schedule delays)
    - cron: '0 1 * * *'  # 10:00 JST re-kick: if the 07:00 run has not fired by 10:00, this publishes instead (Jun's design, 2026-11-17)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-articles
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Publish one due article
        run: python3 tools/publish_next.py
      - name: Commit changes when present
        id: commit
        run: |
          git add articles sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish next scheduled article'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger the existing deploy workflow.
      - name: FTP Deploy
        if: steps.commit.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /karustep-LP/
